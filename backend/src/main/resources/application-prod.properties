# ============================================================
# PRODUCTION CONFIGURATION
# ============================================================

spring.application.name=patient-management-system


# ============================================================
# SERVER
# ============================================================

server.port=8080


# ============================================================
# POSTGRESQL DATABASE
# ============================================================

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

spring.datasource.driver-class-name=org.postgresql.Driver


# ============================================================
# HIKARI CONNECTION POOL
# ============================================================

spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000


# ============================================================
# JPA / HIBERNATE
# ============================================================

spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Hibernate automatically detects PostgreSQL.
# No explicit dialect required.

spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl


# ============================================================
# JWT
# ============================================================

app.jwt.secret=${APP_JWT_SECRET}
app.jwt.expiration=86400000


# ============================================================
# FILE UPLOAD
# ============================================================

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

app.upload.dir=${APP_UPLOAD_DIR:/app/uploads/medical-reports}


# ============================================================
# AI SERVICE
# ============================================================

app.ai.service.url=${APP_AI_SERVICE_URL:http://ai-service:8000}


# ============================================================
# LOGGING
# ============================================================

logging.level.com.pms=INFO
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN


# ============================================================
# HEALTH
# ============================================================

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
