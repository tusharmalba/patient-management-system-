# ╔══════════════════════════════════════════════════════════════════════╗
# ║           PRODUCTION PROFILE — application-prod.properties           ║
# ║                                                                       ║
# ║  Activated by: SPRING_PROFILES_ACTIVE=prod                           ║
# ║  Overrides application.properties for production settings            ║
# ║  Sensitive values injected via environment variables                  ║
# ╚══════════════════════════════════════════════════════════════════════╝

# ── Database (values injected via Docker environment / Railway secrets) ──
# These OVERRIDE application.properties when prod profile is active
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

# ── JPA (production-safe settings) ──
# validate = verify schema matches entities (never auto-create in prod)
# For first deploy: change to 'update', then switch back to 'validate'
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# ── JWT (injected via environment variable) ──
app.jwt.secret=${APP_JWT_SECRET}
app.jwt.expiration=86400000

# ── File Upload (container path) ──
app.upload.dir=${APP_UPLOAD_DIR:/app/uploads/medical-reports}

# ── AI Service (Docker service name) ──
app.ai.service.url=${APP_AI_SERVICE_URL:http://ai-service:8000}

# ── Logging (less verbose in production) ──
logging.level.com.pms=INFO
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN

# ── Actuator (health endpoint for Docker healthcheck) ──
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
