# ╔══════════════════════════════════════════════════════════╗
# ║         APPLICATION CONFIGURATION                        ║
# ╚══════════════════════════════════════════════════════════╝

spring.application.name=patient-management-system


# ═══════════════════════════════════════════════════════════
# SERVER CONFIG
# ═══════════════════════════════════════════════════════════

server.port=8080


# ═══════════════════════════════════════════════════════════
# POSTGRESQL DATABASE CONFIG
# ═══════════════════════════════════════════════════════════

# PostgreSQL JDBC URL
spring.datasource.url=jdbc:postgresql://localhost:5432/pms_db

spring.datasource.username=postgres
spring.datasource.password=YOUR_POSTGRES_PASSWORD

# PostgreSQL JDBC Driver
spring.datasource.driver-class-name=org.postgresql.Driver


# ═══════════════════════════════════════════════════════════
# CONNECTION POOL - HIKARICP
# ═══════════════════════════════════════════════════════════

spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000


# ═══════════════════════════════════════════════════════════
# JPA / HIBERNATE CONFIG
# ═══════════════════════════════════════════════════════════

# update = update database schema based on entities
spring.jpa.hibernate.ddl-auto=update

# Show SQL queries in console
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# PostgreSQL Hibernate dialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Keep Java camelCase names as database column names
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl


# ═══════════════════════════════════════════════════════════
# JWT CONFIGURATION
# ═══════════════════════════════════════════════════════════

app.jwt.secret=pms_super_secret_key_that_is_very_long_and_secure_2024

# 24 hours = 86400000 milliseconds
app.jwt.expiration=86400000


# ═══════════════════════════════════════════════════════════
# FILE UPLOAD CONFIG
# ═══════════════════════════════════════════════════════════

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

app.upload.dir=uploads/medical-reports


# ═══════════════════════════════════════════════════════════
# SWAGGER / OPENAPI CONFIG
# ═══════════════════════════════════════════════════════════

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.operations-sorter=method


# ═══════════════════════════════════════════════════════════
# LOGGING CONFIG
# ═══════════════════════════════════════════════════════════

logging.level.com.pms=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate.SQL=DEBUG


# ═══════════════════════════════════════════════════════════
# AI SERVICE CONFIG
# ═══════════════════════════════════════════════════════════

# Python FastAPI AI service
app.ai.service.url=http://localhost:8000

# Docker Compose:
# app.ai.service.url=http://ai-service:8000
