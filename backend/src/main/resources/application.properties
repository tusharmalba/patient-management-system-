# ╔══════════════════════════════════════════════════════════╗
# ║         APPLICATION CONFIGURATION                        ║
# ║  Spring Boot reads this file at startup automatically    ║
# ╚══════════════════════════════════════════════════════════╝

# Application name (used in logs and service discovery)
spring.application.name=patient-management-system

# ═══════════════════════════════════════════════
# SERVER CONFIG
# ═══════════════════════════════════════════════
server.port=${PORT:8080}

# ═══════════════════════════════════════════════
# DATABASE CONFIG
# ═══════════════════════════════════════════════
# JDBC URL: jdbc:postgresql://host:port/database_name
spring.datasource.url=jdbc:postgresql://dpg-db6s2lom7kps73b591ug-a.oregon-postgres.render.com:5432/pms_db_kw8q
spring.datasource.username=pms_db_kw8q_user
spring.datasource.password=OWZFLkLsCfRNVch5sJj1pic6eRXSqVvz
spring.datasource.driver-class-name=org.postgresql.Driver

# Connection pool (HikariCP is Spring Boot default - fastest pool)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000

# ═══════════════════════════════════════════════
# JPA / HIBERNATE CONFIG
# ═══════════════════════════════════════════════
# ddl-auto options:
#   create       = Drop + Create on startup (dev only)
#   create-drop  = Create on startup, drop on shutdown
#   update       = Update schema without dropping data (dev)
#   validate     = Validate schema matches entities (prod)
#   none         = Do nothing (prod with Flyway/Liquibase)
spring.jpa.hibernate.ddl-auto=update

# Show SQL queries in console (disable in production)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Dialect is auto-detected from the PostgreSQL driver

# Naming strategy: converts camelCase fields to snake_case columns
# patientName → patient_name in database
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# ═══════════════════════════════════════════════
# JWT CONFIGURATION
# ═══════════════════════════════════════════════
# Secret key: must be 256+ bits (32+ chars) for HS256 algorithm
# In production: use environment variable or secrets manager
app.jwt.secret=2f426871834dabcb456ec11c4dba2505
# Token expiration: 24 hours in milliseconds (24 * 60 * 60 * 1000)
app.jwt.expiration=86400000

# ═══════════════════════════════════════════════
# FILE UPLOAD CONFIG
# ═══════════════════════════════════════════════
# Max file size per request
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
# Directory to store uploaded files
app.upload.dir=uploads/medical-reports

# ═══════════════════════════════════════════════
# SWAGGER / OPENAPI CONFIG
# ═══════════════════════════════════════════════
# Swagger UI accessible at: http://localhost:8080/swagger-ui.html
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/api-docs
# Show Authorize button in Swagger for JWT testing
springdoc.swagger-ui.operations-sorter=method

# ═══════════════════════════════════════════════
# LOGGING CONFIG
# ═══════════════════════════════════════════════
logging.level.com.pms=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate.SQL=DEBUG

# ═══════════════════════════════════════════════
