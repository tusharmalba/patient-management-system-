# ============================================================
# APPLICATION
# ============================================================

spring.application.name=patient-management-system


# ============================================================
# SERVER
# ============================================================

server.port=8080


# ============================================================
# POSTGRESQL DATABASE - LOCAL
# ============================================================

spring.datasource.url=jdbc:postgresql://localhost:5432/pms_db
spring.datasource.username=postgres
spring.datasource.password=YOUR_POSTGRES_PASSWORD
spring.datasource.driver-class-name=org.postgresql.Driver


# ============================================================
# HIKARI CONNECTION POOL
# ============================================================

spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000


# ============================================================
# JPA / HIBERNATE
# ============================================================

spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Hibernate 6 automatically detects PostgreSQL.
# Do NOT specify hibernate.dialect.


# Keep Java camelCase names as database column names
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl


# ============================================================
# JWT
# ============================================================

app.jwt.secret=pms_super_secret_key_that_is_very_long_and_secure_2024
app.jwt.expiration=86400000


# ============================================================
# FILE UPLOAD
# ============================================================

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

app.upload.dir=uploads/medical-reports


# ============================================================
# SWAGGER / OPENAPI
# ============================================================

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.operations-sorter=method


# ============================================================
# LOGGING
# ============================================================

logging.level.com.pms=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate.SQL=DEBUG


# ============================================================
# AI SERVICE
# ============================================================

app.ai.service.url=http://localhost:8000
