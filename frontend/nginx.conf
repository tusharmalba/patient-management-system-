# ╔══════════════════════════════════════════════════════════════════════╗
# ║                     NGINX CONFIGURATION                              ║
# ║                                                                       ║
# ║  Serves React static files + proxies /api/* to Spring Boot           ║
# ║                                                                       ║
# ║  KEY PROBLEM: React Router uses browser history (pushState).          ║
# ║  When user refreshes /patients, Nginx must serve index.html          ║
# ║  (not return 404 for a non-existent file).                           ║
# ║  try_files $uri $uri/ /index.html; → solves this!                    ║
# ╚══════════════════════════════════════════════════════════════════════╝

server {
    listen 80;
    server_name _;

    # Serve React static files from /dist
    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression — reduces file size ~70%
    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml text/javascript;
    gzip_min_length 256;

    # Cache static assets (JS/CSS/images) for 1 year
    # Vite adds content hashes to filenames, so this is safe
    location ~* \.(js|css|png|jpg|gif|svg|ico|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # API proxy — forward /api/* to Spring Boot backend
    # In Docker Compose: "backend" is the service name (Docker DNS)
    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts for long-running requests (file uploads)
        proxy_connect_timeout 60s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }

    # React Router: serve index.html for ALL non-file routes
    # This lets React handle routing client-side
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";
    add_header X-XSS-Protection "1; mode=block";
}
